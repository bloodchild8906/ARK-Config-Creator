name: Bug report
description: Tell us what is not working.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Remove passwords, API keys, IP addresses, and other private server details."
  - type: input
    id: version
    attributes:
      label: App version
      description: The version shown in the app footer.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - General settings
        - Mods
        - Import or export
        - Local server setup
        - Live console service
        - Remote deploy
        - In-place updater
        - Installer
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe logs
      description: Do not include API tokens, passwords, or public IP addresses.
    validations:
      required: true
